# TLS reverse proxy in front of the internal API. Install as
# /etc/nginx/sites-available/sherlock, then enable with a symlink in sites-enabled.
# Replace sherlock.example.corp with your DNS name, and point to your organisation's
# certificate.

server {
    listen 80;
    server_name sherlock.example.corp;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sherlock.example.corp;

    ssl_certificate     /etc/sherlock/tls/fullchain.pem;
    ssl_certificate_key /etc/sherlock/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # CTI reports (PDF): application cap 15 MB, headroom for the HTTP envelope.
    client_max_body_size 20m;

    # Frontend: built static files (web/dist), client-side routing.
    root /opt/sherlock/web/dist;
    index index.html;
    location / {
        try_files $uri /index.html;
    }

    # Internal API and live hunt stream (SSE: no buffering).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
    }
}
